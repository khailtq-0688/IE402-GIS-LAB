        // =================================================================================

        // Hàm này tải file về, xóa tọa độ Z cứng trong file, tạo ra file tạm trong bộ nhớ
        async function createCleanBlob(url) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Không tìm thấy file: ${url}`);

            const geojson = await response.json();

            // Duyệt qua tất cả feature để xóa tọa độ Z (phần tử thứ 3 trong mảng tọa độ)
            geojson.features.forEach((feature) => {
              if (feature.geometry && feature.geometry.coordinates) {
                const geomType = feature.geometry.type;

                // Xử lý cho Polygon (Đa giác)
                if (geomType === "Polygon") {
                  feature.geometry.coordinates =
                    feature.geometry.coordinates.map(
                      (ring) => ring.map((coord) => [coord[0], coord[1]]) // Chỉ lấy X, Y
                    );
                }
                // Xử lý cho MultiPolygon (Nếu có)
                else if (geomType === "MultiPolygon") {
                  feature.geometry.coordinates =
                    feature.geometry.coordinates.map((polygon) =>
                      polygon.map((ring) =>
                        ring.map((coord) => [coord[0], coord[1]])
                      )
                    );
                }
              }
            });

            // Tạo Blob URL từ dữ liệu đã làm sạch
            const blob = new Blob([JSON.stringify(geojson)], {
              type: "application/json",
            });
            return URL.createObjectURL(blob);
          } catch (error) {
            console.error("Lỗi xử lý file:", error);
            return null;
          }
        }

        async function loadBuildings() {
          for (const building of buildingsConfig) {
            // UI: Hiển thị trạng thái đang tải
            const divInfo = document.createElement("div");
            divInfo.className = "building-item";
            divInfo.style.borderLeftColor = building.color;
            divInfo.innerHTML = `
              <b>${building.name}</b><br>
              <span class="status-text loading">Đang xử lý ${building.floors.length} tầng...</span>
            `;
            statusList.appendChild(divInfo);

            let currentOffset = 0; // Reset độ cao về 0 cho tòa nhà mới

            for (let i = 0; i < building.floors.length; i++) {
              const floor = building.floors[i];
              let layerUrl;
              let rendererConfig;
              let elevationConfig;

              // TRƯỜNG HỢP 1: NẾU LÀ MÁI NHÀ (Giữ nguyên Z, không Extrude)
              if (floor.isRoof) {
                // Không dùng createCleanBlob để giữ nguyên Z trong file
                const response = await fetch(floor.url);
                const blob = await response.blob();
                layerUrl = URL.createObjectURL(blob);

                // Cấu hình hiển thị theo tọa độ Z thật
                rendererConfig = {
                  type: "simple",
                  symbol: {
                    type: "polygon-3d",
                    symbolLayers: [
                      {
                        type: "fill", // Dùng Fill (tô mặt) thay vì Extrude (kéo khối)
                        material: { color: building.color },
                      },
                    ],
                  },
                };

                // Độ cao: Relative (so với mặt đất + độ cao các tầng dưới)
                elevationConfig = {
                  mode: "relative-to-ground",
                  offset: currentOffset,
                };
              }

              // TRƯỜNG HỢP 2: TẦNG BÌNH THƯỜNG (Xóa Z, dùng Extrude)
              else {
                layerUrl = await createCleanBlob(floor.url);

                rendererConfig = {
                  type: "simple",
                  symbol: {
                    type: "polygon-3d",
                    symbolLayers: [
                      {
                        type: "extrude", // Kéo khối
                        size: floor.height,
                        material: { color: building.color },
                        edges: { type: "solid", color: "#E7DFD0FF", size: 0.5 },
                      },
                    ],
                  },
                };

                elevationConfig = {
                  mode: "relative-to-ground",
                  offset: currentOffset,
                };
              }

              // Tạo Layer chung
              if (layerUrl) {
                const layer = new GeoJSONLayer({
                  url: layerUrl,
                  title: `${building.name} - Tầng ${i + 1}`,
                  elevationInfo: elevationConfig,
                  renderer: rendererConfig,
                  popupTemplate: {
                    title: "{name}",
                    content: `Mái nhà/Tầng: ${i + 1}`,
                  },
                });

                map.add(layer);

                // Cộng dồn độ cao (Nếu là mái thì không cộng thêm height vì nó tính theo Z rồi)
                if (!floor.isRoof) {
                  currentOffset += floor.height;
                }
              }
            }

            // Cập nhật UI khi xong
            divInfo.querySelector(".status-text").innerHTML = "✔ Đã tải xong";
            divInfo.querySelector(".status-text").className =
              "status-text done";
          }
        }
